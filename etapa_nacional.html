<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etapa Nacional - FIRA Brasil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@500;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <!-- Estilos Compartilhados -->
    <link rel="stylesheet" href="./src/css/variables.css">
    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/header.css">
    <link rel="stylesheet" href="./src/css/schedule.css">
    <link rel="stylesheet" href="./src/css/faq.css">
    <link rel="stylesheet" href="./src/css/hero.css">
    <link rel="stylesheet" href="css/mundial/locais_mundial.css">
    <link rel="stylesheet" href="./src/css/sponsors.css">
    <link rel="stylesheet" href="./src/css/footer.css">
    <link rel="stylesheet" href="src/css/carrinho.css">

    <!-- Estilo Específico desta página (se houver) -->
    <!-- <link rel="stylesheet" href="./src/css/etapas-estaduais.css"> -->
</head>

<body>

    <!-- Componente Navbar -->
    <load src="./src/componentes/navbar.html" />

    <main>
        <!-- Seção Schedule -->
        <section class="schedule-section" id="schedule">
            <div class="schedule-container">

                <!-- Cabeçalho -->
                <header class="schedule-header">
                    <span class="label-text">ETAPA NACIONAL</span>
                    <h2 class="heading-2">ETAPA NACIONAL NA PARAÍBA</h2>
                    <p class="body-1 text-transparency">Inscreva a sua equipe e conquiste a vitória.</p>
                </header>

                <!-- Lista de Dias (Cards) -->
                <div class="schedule-list">
                    <!-- DAY 1 -->
                    <article class="schedule-card">
                        <!-- Coluna Esquerda: Imagem e Data -->
                        <div class="card-image-col"
                            style="background-image: url('https://framerusercontent.com/images/1n5ARKV5tNIOe4vP7yqmpQqPhI.png');">
                            <div class="image-overlay"></div>
                            <div class="date-location">
                                <h4 class="heading-2">PARAÍBA</h4>
                                <p class="body-2 text-transparency">Conde</p>
                            </div>
                        </div>

                        <!-- Coluna Direita: Cronograma -->
                        <div class="card-content-col">

                            <div class="schedule-item">
                                <div class="item-details">
                                    <p class="body-1-sb text-transparency">Organizador</p>
                                </div>
                            </div>

                            <div class="schedule-item">
                                <div class="item-details">
                                    <p class="body-2 text-transparency">Profesor: Alexandre Amancio</p>
                                    <div class="avatars">
                                        <img src="https://framerusercontent.com/images/DbG9Vzab0pV2d4J06bWf9oo.webp"
                                            alt="Speaker">
                                    </div>
                                </div>
                            </div>

                            <div class="schedule-item">
                                <div class="item-details">
                                    <p class="body-1-sb text-transparency">Local e Data do Evento</p>
                                    <p class="body-2 text-transparency">STEM TECNOLOGIA EDUCACIONAL | 20/05 - 31/08</p>
                                    <div class="avatars button-container">
                                        <button class="cta-btn body-2-sb" id="ticketBtn">Solicitar Carta Convite</button>
                                        <button class="cta-btn body-2-sb" id="ticketBtn">Inscrever-se</button>
                                        <button class="cta-btn body-2-sb" id="ticketBtn">Pagamento</button>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </article>
                </div>
            </div>
        </section>

    </main>

    <!-- 4. CARRINHO LATERAL (Escondido por padrão, abre via clique) -->
    <load src="./src/componentes/carrinho.html" />
    <!-- Componente FAQ -->
    <load src="./src/componentes/faq.html" />
    <!-- Componente Sponsors -->
    <load src="./src/componentes/sponsors.html" />
    <!-- Componente Footer -->
    <load src="./src/componentes/footer.html" />

    <!-- Scripts Compartilhados -->
    <script type="module" src="./src/js/header.js"></script>
    <script type="module" src="./src/js/faq.js"></script>
    <script type="module" src="src/js/carrinho.js"></script>
</body>

</html>
